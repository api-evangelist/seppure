description: SepPure Technologies (Seppure) is a deep-tech company building advanced organic
  solvent nanofiltration (OSN) membrane systems that make industrial chemical separation
  dramatically more sustainable, claiming processes up to 580x less energy intensive than
  conventional thermal separation. Its product line includes GreenMem organic solvent nanofiltration
  membranes, RE(SOLV) solvent recovery systems, and DE(SOLV) oil-refinery equipment, serving
  edible-oil refining, pharmaceutical filtration, semiconductor processing, and specialty
  chemicals across offices in Singapore and Calgary, Canada. It is a 500 Global portfolio company.
  Seppure sells membranes online at seppure.shop and publishes no public API, developer
  documentation, or GitHub organization at this time.
